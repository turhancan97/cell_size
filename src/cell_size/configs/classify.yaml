defaults:
  - classifier: default
  - morphology_qc: default
  - _self_

checkpoint: null              # path to best model checkpoint
predictions_csv: null         # resume: reuse this predictions.csv and skip inference
data_dir: '/shared/sets/datasets/vision/cellpose/Adults_training'                # root of segmented dataset to classify
